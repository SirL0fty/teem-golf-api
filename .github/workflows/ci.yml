name: CI

on:
  pull_request:
    branches:
      - "**"
      - "cursor/**"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Synth
        run: bun run synth
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          CDK_DISABLE_CLI_TELEMETRY: "1"
